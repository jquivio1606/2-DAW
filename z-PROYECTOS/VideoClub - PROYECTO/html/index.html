<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videoclub Online 🎥</title>
  <link rel="stylesheet" href="../css/estilos.css">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
  <div class="contenedor">
    <h1>🎥 Bienvenido al Videoclub Online 🎬</h1>
    <p>¡Busca información sobre tus películas favoritas!</p>
    <div class="caja-busqueda">
      <input type="text" id="titulo-pelicula" placeholder="Escribe el título de una película..." />
      <button id="boton-buscar">Buscar</button>
    </div>

    <div id="loading" class="hidden">
      <p>Cargando<span id="dots">...</span></p>
    </div>

    <div id="informacion-pelicula" class="informacion-pelicula">
      <!-- Aquí se mostrará la información de las películas -->
    </div>
  </div>

  <script src="../js/datos.js"></script>
</body>
</html>
