<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <h1>Introduzca los datos</h1>
    <input type="text" id="nombre">
    <input type="text" id="clave">
    <input type="button" id="boton" onclick="capturar()" value="Agregar usuario">
    <table id="tabla">
        <th>Nombre</th>
        <th>Clave</th>
    </table>
    <script>
        function capturar(){
            //Crear variables con el nombre y la clave obtenidos de los input
            var getnombre=document.getElementById("nombre").value;
            var getclave=document.getElementById("clave").value;
            
            //Objeto persona
            function Persona(Nombre, Clave){
                this.Nombre=Nombre;
                this.Clave=Clave;
            };

            Usuario = new Persona(getnombre,getclave);
            //console.log(Usuario);
            agregar();
        };      
        //Crear array de datos vacio
        var arrayDatos=[];
        function agregar(){
            arrayDatos.push(Usuario);
            document.getElementById("tabla").innerHTML += '<td>'+Usuario.Nombre+'</td><td>'+Usuario.Clave+'</td>';
        };
        //Crear clase mascota
        class Mascota{
            constructor(nombre, tipo, voz){
                this.nombre=nombre;
                this.tipo=tipo;
                this.voz=voz;
            }
            grupo = "Animales";
            saludar(){
                console.log(this.voz+" y soy un/a "+this.tipo);
            }
        };
        miPerro = new Mascota('Tom', 'perro', 'ojuuu');
        miGato = new Mascota('Catalina', 'gata', 'miauuuuulll');
        console.log(miPerro);
        console.log(miGato);
        console.log("Mi perro pertenece al grupo de "+ miPerro.grupo);
        miPerro.saludar();
        miGato.saludar();
        
        class Rectangulo{
            //Constuctor
            constructor(x,y){
                this.alto=x;
                this.ancho=y;
            }

            //Métodos
            info(){
                return "Argumentos el ancho y el alto"
            }
            area(){
                return this.alto*this.ancho;
            }
        }
        cuadro = new Rectangulo (10,20);
        console.log(cuadro.area());
        console.log(Rectangulo.info());
        console.log(cuadro.info());

    </script>
</body>
