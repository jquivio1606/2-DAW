<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media</title>
</head>
<body>
    <script>
        /*Ejercicio 11. Programa un script que pida al usuario que teclee 4 números (uno cada vez). Con esos números el
        programa deberá calcular la media aritmética. O sea la suma de los 4 números dividida entre 4. */
        let suma=0, numero;
        for (let i = 0; i < 4; i++) {
            numero=parseInt(prompt("Deme el número "+(i+1)));
            suma+=numero;            
        }
        media=suma/4;
        alert("La media es: "+media);
    </script>
</body>
</html>
