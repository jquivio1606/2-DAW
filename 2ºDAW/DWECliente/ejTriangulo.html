<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triángulo</title>
</head>
<body>
    <input type="number" id="numero">
    <input type="button" value="Dibujar" onclick="pinta()">
    <p id="dibujo"></p>
    <script>
        function pinta(){
            var num=document.getElementById("numero").value;
            var parrafo= document.getElementById("dibujo")
            var result="";
            for(let fila=1;fila<=num;fila++){
                for(let i = fila; i>0;i--){
                    result+= '* ';
                }
                parrafo.innerHTML+= result + '<br>';
                result="";
            }
        }
    </script>
</body>
</html>
