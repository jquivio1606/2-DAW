<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }

        #contenedor {
            margin: 10px auto;
            width: 540px;
            height: 120px;
        }

        .cronometro {
            font-family: courier, sans-serif;
            font-size: 80px;
            color: blueviolet;
            float: left;
        }

        .boton {
            color: cornsilk;
            width: 130px;
            height: 30px;
            font-size: 20px;
            font-family: helvetica;
            background-image: linear-gradient(rgba(79, 5, 225, 0.67), rgb(164, 143, 200));
            cursor: pointer;
        }

        .boton:active {
            background-image: -o-linear-gradient(rgb(136, 208, 136), green);
        }

        .boton:hover {
            box-shadow: 0px 0px 14px gold;
        }
    </style>
    <title>Cronómetro</title>
</head>

<body>
    <div id="contenedor">
        <div class="cronometro" id="horas">00</div>
        <div class="cronometro" id="minutos">:00</div>
        <div class="cronometro" id="segundos">:00</div>
        <div class="cronometro" id="centesimas">:00</div>
        <input type="button" class="boton" id="iniciar" value="Iniciar &#9658;" onclick="iniciar()">
        <input type="button" class="boton" id="parar" value="Parar &#8718;" onclick="parar()">
        <input type="button" class="boton" id="continuar" value="Continuar &#8634" onclick="iniciar()">
        <input type="button" class="boton" id="resetear" value="Resetear &#8635" onclick="resetear()">
    </div>
    <script>
        var Centesimas = 0;
        var Segundos = 0;
        var Minutos = 0;
        var Horas = 0;
        function iniciar() {
            control = setInterval(cronometro, 10);
        }
        function parar() {
            clearInterval(control);
        }
        function resetear() {
            clearInterval(control);
            Centesimas = 0;
            Segundos = 0;
            Minutos = 0;
            Horas = 0;
            centesimas.innerHTML = ":00";
            segundos.innerHTML = ":00";
            minutos.innerHTML = ":00";
            horas.innerHTML = "00"
        }
        function cronometro() {
            Centesimas++;
            if (Centesimas <= 99) {
                centesimas.innerHTML = ":" + Centesimas;
            } else {
                Centesimas = -1;
                Segundos++;
                if (Segundos < 10) {
                    segundos.innerHTML = ":0" + Segundos;
                } else {
                    segundos.innerHTML = ":" + Segundos;
                }
                if (Segundos == 59) {
                    Segundos = -1;
                    Minutos++;
                    if (Minutos < 10) {
                        minutos.innerHTML = ":0" + Minutos;
                    } else {
                        minutos.innerHTML = ":" + Minutos;
                    }
                }
                if (Minutos == 59) {
                    Minutos = -1;
                    Horas++;
                    if (Horas < 10) {
                        horas.innerHTML = ":0" + Horas;
                    } else {
                        horas.innerHTML = ":" + Horas;
                    }
                }
            }


        }



    </script>
</body>

</html>
