<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./js/calcIMC.js" defer></script>
    <title>IES TRAFALGAR</title>
</head>
<body>
    <input type="text" id="peso">
    <input type="text" id="altura">
    <input type="button" id="calcular" value="Calculo del ICM">
    <p id="icm"></p>
    <script type="text/javascript">
        var boton=document.getElementById("calcular");
        boton.addEventListener("click",calculo,false);
        function calculo()
        {
            var peso=parseInt(document.getElementById("peso").value);
            var altura=parseFloat(document.getElementById("altura").value);
            var resultado=peso/(altura**2);
            document.getElementById("icm").innerHTML=resultado.toFixed(2);
        }
    </script>
    <input type="text" min="1" max="10" id="radio">
    <input type="button" id="calcular2" value="Calcula el Área y Longitud">
    <p id="longitud"></p>
    <p id="area"></p>
   
</body>
</html>
