<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let array1 = new Array ("hola", 34, "Adios", "Segunda B");
        var array2 = ["Cadistas", "Madridistas", "Atléticos", 45];
        console.log(array1);
        console.log(array2);
        let array3 = new Array(10);
        array3[1] = 5;
        console.log(array3);
        let array4 = [15];
        console.log(array4);
        let array5 = ["hola", true, 32];
        console.log(typeof array5[1]);
        const array6 = ["hola"];
        array6[0]= "adios";
        console.log(array6);
        //array6 =["hola", "Adios"];//Esto da error porque el array está definido como constante
        //Acceder al los elementos del array
        var coches =["Toyota", "Kia", "Renault", "Juaky"];
        console.log(coches[0], coches[2], coches[-1]);
        coches[0]= "Tesla";
        console.log(coches);
        coches[-1]= "Mercedes";
        console.log(coches);
        console.log(coches.length);
        let vacio = [];
        console.log(vacio.length);
        vacio[0] = 33;
        vacio.push(32);
        console.log(vacio);
        var numeros =[23,24,25,26];
        console.log(numeros[numeros.length-1]);
        numeros[6]= "Hola";
        console.log(numeros);
        var frutas = ["Pero", "Mandarina"];
        frutas.push("Melón");
        console.log(frutas);
        frutas.push("Coliflor");
        console.log(frutas);
        frutas.splice(2, 0, "Tomate");//Inserta en el array sin reemplazar
        console.log(frutas);
        frutas.splice(frutas.length-1, 0, "Aguacate");
        console.log(frutas);
        frutas.splice(2, 2, "Aupa Madrid");//El segundo nº indica posiciones que queremos borrar
        console.log(frutas);
        var verduras = ["Lechuga", "Espárragos", "Tortilla francesa", "Papas"];
        var alimentos = frutas.concat(verduras);//Une dos arrays
        var numericos =[1,2,3,4];
        var arraynumeros = numericos.concat(5,6,7,8,9);
        console.log(arraynumeros);
        console.log(alimentos);
        delete alimentos[0];
        console.log(alimentos);
        alimentos.pop();
        console.log(alimentos);
        alimentos.shift();
        console.log(alimentos);
        //Buscando
        let array8=[1,2,3,4,5,6,7,8,9];
        let valor = array8.find(e => e === 5);
        console.log(valor, typeof valor);
        valor = array8.find(function(e) {return e === 5});
        console.log(valor, typeof valor);
        valor = array8.find(e => e === 14);
        console.log(valor, typeof valor);
        valor = array8.indexOf(6);
        console.log(valor);
        valor = array8.indexOf(12);
        console.log(valor);
        array8.push(6);
        array8.push(-2);
        console.log(array8);
        valor = array8.indexOf(6, 7);
        console.log(valor);
        valor = array8.lastIndexOf(3);
        console.log(valor);
        //Ordenar
        console.log(frutas.sort());
        console.log(array8.sort());
        console.log(frutas.reverse());
        console.log(array8.reverse());
    </script>
</body>
</html>
