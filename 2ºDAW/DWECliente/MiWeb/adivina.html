<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivina el número</title>
</head>

<body>
    <h1>Adivina Adivinanza</h1>
    <h2 id="h2"></h2>
    <h3 id="acertado"></h3>
    <p id="adivina">El número era </p>
    <script>
        //Genera un número aleatorio del 1 al 100
        var minimo = 1;
        var maximo = 5;
        var numAleatorio = parseInt(Math.random() * (maximo - minimo) + minimo);

        var h2 = document.getElementById("h2");
        var adivina = document.getElementById("adivina");
        adivina += numAleatorio;
        console.log(numAleatorio,adivina);

        while (true) {
            //Pedir números al usuario
            var numUsuario = parseInt(prompt("Dime un número entre 1 y 100. Pulsa 0 para terminar."));
            if(numUsuario==numAleatorio){
                document.getElementById("acertado").innerHTML="Has acertado!!";
                break;
            }else if(numUsuario==0){
                break;
            }else if(numUsuario>numAleatorio){
                alert("El numero es menor");
            }else if(numUsuario<numAleatorio){
                alert("El número es mayor");
            }
        }
        document.getElementById("adivina").innerHTML="El número era 4"+numAleatorio;
    </script>
</body>

</html>
