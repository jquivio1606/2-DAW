<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
    <title>Validar y capturar nuestros datos de un formulario</title>
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-8 offset-2">
                <form id="formulario" class="p-3 mt-5 shadow border">
                    <h2 class="text-center text-primary">Formulario</h2>
                    <input type="text" id="nombre" placeholder="Escriba su nombre" class="form-control my-2">
                    <input type="text" id="edad" placeholder="Escriba su edad" class="form-control my-2">
                    <button class="btn btn-primary mt-2" type="submit">MOSTRAR LOS DATOS</button>
                </form>
                <hr>
                    <h3 id="salida" class="text-center fw_light"></h3>
            </div>
        </div>
    </div>
    <script>
        let formulario=document.querySelector("#formulario");//accede a todos los datos del formulario
        formulario.addEventListener("submit",validarFormulario,false);
        function validarFormulario(e){
            e.preventDefault();//permite cancelar el envío
            let nombre = document.querySelector("#nombre").value;//Obtiene el dato nombre
            const edad= document.querySelector("#edad").value;//Obtiene el dato edad
            const salida= document.getElementById("salida");
            salida.textContent=`Su nombre es ${nombre} y tienes ${edad} años`;
        }
    </script>
</body>
</html>
