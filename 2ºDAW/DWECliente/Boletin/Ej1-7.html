<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array de números</title>
</head>
<body>
    <h3 id="suma">La suma de los números del array es: </h3>
    <h3 id="mayor">El número mayor del array es: </h3>
    <h3 id="pares">Los números pares del array son: </h3>
    <h3 id="primos">Los números primos son: </h3>
    <h3 id="ordenados">Los números ordenados de menor a mayor son: </h3>
    <h3 id="ordenados2">Los números ordenados de mayor a menor son: </h3>
    <h3 id="posiciones">Los números ordenados desde una posición son: </h3>
    <script>
        let numeros=[3,45,6,23,11,52];
        sumarElementos(numeros);
        numeroMayor(numeros);
        filtrarPares(numeros);
        filtrarPrimos(numeros);
        ordenarNumeros(numeros);
        ordenarNumerosSinModificar(numeros);

        /*Ejercicio 1. Sumar elementos de un array de números*/
        function sumarElementos(numeros){
            let suma= numeros.reduce((acum,num)=>{return acum+num},0);
            document.getElementById("suma").innerHTML+=suma;
            return suma;
        }

        /*Ejercicio 2. Encontrar el número mayor de un array*/
        function numeroMayor(array){
            let mayor=Math.max(...array);
            document.getElementById("mayor").innerHTML+=mayor;
            return mayor;
        }

        /*Ejercicio 3. Filtrar números pares*/
        function filtrarPares(array){
            let par= valor=>valor%2==0;
            document.getElementById("pares").innerHTML+=array.filter(par);
            return par;
        }

        /*Ejercicio 4. Filtrar números primos*/
        function esPrimo(numero){
            for (let i=2; i<numero;i++){
                if(numero%i===0){
                    return false;
                }
            }
            return true;
        }
        function filtrarPrimos(array){
            let primos=array.filter(esPrimo)
            document.getElementById("primos").innerHTML+=primos;
            return primos;
        }
        
        /*Ejercicio 5. Ordenar de menor a mayor*/
        function ordenarNumeros(array){
            let ordenados=  array.slice().sort((a,b)=>a-b)
            document.getElementById("ordenados").innerHTML+=ordenados;
            return ordenados;
        }

        /*Ejercicio 6. Ordenar de mayor a menor sin modificar el array original*/
        function ordenarNumerosSinModificar(array){
            let ordenados2=  array.slice().sort((a,b)=>b-a);
            document.getElementById("ordenados2").innerHTML+=ordenados2;
            return ordenados2;
        }

        /*Ejercicio 7. Ordenar a partir de una posición*/
        function ordenarDesdePosicion(array,posicion){
            if(posicion<0 || posicion>=array.length){
                return array.slice();
            }
            let arrayInicial = array.slice(0,posicion);
            let arrayOrdenar = array.slice(posicion);
            let parteOrdenada = arrayOrdenar.sort((a,b)=>a-b);
            return arrayInicial.concat(parteOrdenada);
        }
        const posiciones=ordenarDesdePosicion(numeros, 2);
        document.getElementById("posiciones").innerHTML+=posiciones;

    </script>
    
</body>
</html>
