<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

    </style>
</head>

<body>

    <script>
        // Crear el contenedor principal
        const contenedor = document.createElement("div");
        contenedor.style.textAlign = "center";
        contenedor.style.fontFamily = "Arial, sans-serif";
        contenedor.style.padding = "20px";
        document.body.appendChild(contenedor);

        // Título del juego
        const titulo = document.createElement("h1");
        titulo.textContent = "Juego de las 7 y Media";
        contenedor.appendChild(titulo);

        // Botón para iniciar el juego
        const botonIniciar = document.createElement("button");
        botonIniciar.textContent = "Iniciar Juego";
        botonIniciar.style.margin = "10px";
        botonIniciar.style.padding = "10px";
        contenedor.appendChild(botonIniciar);

        // Botón para pedir carta
        const botonPedir = document.createElement("button");
        botonPedir.textContent = "Pedir Carta";
        botonPedir.style.margin = "10px";
        botonPedir.style.padding = "10px";
        botonPedir.disabled = true;
        contenedor.appendChild(botonPedir);

        // Botón para plantarse
        const botonPlantar = document.createElement("button");
        botonPlantar.textContent = "Plantarse";
        botonPlantar.style.margin = "10px";
        botonPlantar.style.padding = "10px";
        botonPlantar.disabled = true;
        contenedor.appendChild(botonPlantar);

        // Mostrar estado del juego
        const mensaje = document.createElement("p");
        mensaje.textContent = "El juego no ha comenzado.";
        contenedor.appendChild(mensaje);

        const manoTexto = document.createElement("p");
        manoTexto.textContent = "Mano:";
        contenedor.appendChild(manoTexto);

        const puntosTexto = document.createElement("p");
        puntosTexto.textContent = "Puntos: 0";
        contenedor.appendChild(puntosTexto);

        // Baraja de cartas
        const cartas = [
            { nombre: "As", palo: "Oros", valor: 1 },
            { nombre: "Dos", palo: "Oros", valor: 2 },
            { nombre: "Tres", palo: "Oros", valor: 3 },
            { nombre: "Cuatro", palo: "Oros", valor: 4 },
            { nombre: "Cinco", palo: "Oros", valor: 5 },
            { nombre: "Seis", palo: "Oros", valor: 6 },
            { nombre: "Siete", palo: "Oros", valor: 7 },
            { nombre: "Sota", palo: "Oros", valor: 0.5 },
            { nombre: "Caballo", palo: "Oros", valor: 0.5 },
            { nombre: "Rey", palo: "Oros", valor: 0.5 },
        ];

        let mano = [];
        let puntos = 0;

        // Función para iniciar el juego
        botonIniciar.addEventListener("click", () => {
            mano = [];
            puntos = 0;
            mensaje.textContent = "El juego ha comenzado. Pide carta o plántate.";
            manoTexto.textContent = "Mano:";
            puntosTexto.textContent = "Puntos: 0";
            botonPedir.disabled = false;
            botonPlantar.disabled = false;
        });

        // Función para pedir carta
        botonPedir.addEventListener("click", () => {
            const carta = cartas[Math.floor(Math.random() * cartas.length)];
            mano.push(`${carta.nombre} de ${carta.palo}`);
            puntos += carta.valor;
            manoTexto.textContent = `Mano: ${mano.join(", ")}`;
            puntosTexto.textContent = `Puntos: ${puntos.toFixed(1)}`;

            if (puntos > 7.5) {
                mensaje.textContent = "Te has pasado de 7 y media. ¡Has perdido!";
                botonPedir.disabled = true;
                botonPlantar.disabled = true;
            }
        });

        // Función para plantarse
        botonPlantar.addEventListener("click", () => {
            mensaje.textContent = `Te has plantado con ${puntos.toFixed(1)} puntos.`;
            botonPedir.disabled = true;
            botonPlantar.disabled = true;
        });

    </script>
</body>

</html>
