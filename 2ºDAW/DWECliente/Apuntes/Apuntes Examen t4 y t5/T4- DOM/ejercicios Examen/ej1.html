<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivinar Palabras</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }

        input[type="text"] {
            width: 300px;
            padding: 10px;
            margin: 10px;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <h1>Juego de Adivinar Palabras</h1>
    <p>Letras desordenadas:</p>
    <input type="text" id="letrasDesordenadas" readonly>
    <p>Escribe la palabra correcta:</p>
    <input type="text" id="respuesta">
    <p id="mensaje"></p>
    <button id="nuevaPalabra">Nueva palabra</button>
    <button id="verSolucion" disabled>Ver solución</button>
    <button id="finalizarJuego" disabled>Finalizar juego</button>
    <p id="resultado"></p>

    <script>
        // Crea las palabras del juego
        const palabras = ["javascript", "programar", "teclado", "pantalla", "navegador", "internet", "servidor"];
        let palabrasJugadas = [...palabras];
        let palabraActual = "";
        let aciertos = 0;
        let intentos = 0;

        // Añadir un evento a cada boton
        document.getElementById("nuevaPalabra").addEventListener("click", iniciarJuego);
        document.getElementById("verSolucion").addEventListener("click", mostrarSolucion);
        document.getElementById("finalizarJuego").addEventListener("click", finalizarJuego);

        // Coge el input con la respuesta, le añade un evento de teclado. Y cuando pasa llama a comprobarRespuesta
        document.getElementById("respuesta").addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                comprobarRespuesta();
            }
        });

        //Cuando se pulsa el boton Nueva Palabra se inicia el Juego
        function iniciarJuego() {
            // Comprueba si se han terminado las palabras, si se han terminado muestra un alert y finaliza el juego
            if (palabrasJugadas.length === 0) {
                alert("No hay más palabras. Finalizando el juego.");
                finalizarJuego();
                return;
            }

            // Se habilitan los otros 2 botones
            document.getElementById("verSolucion").disabled = false;
            document.getElementById("finalizarJuego").disabled = false;

            // Elegir un índice aleatorio
            const indiceAleatorio = Math.floor(Math.random() * palabrasJugadas.length);

            // Obtener la palabra y eliminarla del array
            palabraActual = palabrasJugadas[indiceAleatorio];
            palabrasJugadas.splice(indiceAleatorio, 1);

            // Desordenar las letras de la palabra
            const letrasDesordenadas = palabraActual.split("").sort(() => Math.random() - 0.5).join("");

            // Escribir el valor en el input
            document.getElementById("letrasDesordenadas").value = letrasDesordenadas;

            //Limpiar el input de respuesta, y el mensaje que pueda haber.
            document.getElementById("respuesta").value = "";
            document.getElementById("mensaje").textContent = "";
        }

        //Comprobación cuando se pulse enter
        function comprobarRespuesta() {
            const respuesta = document.getElementById("respuesta").value.trim().toLowerCase();
            // Se suma un intento
            intentos++;

            // comprueba la respuesta con la palabra, y muestra un mensaje dependiendo de si está bien o no
            if (respuesta === palabraActual) {
                document.getElementById("mensaje").textContent = "¡Correcto!";
                aciertos++;
                document.getElementById("verSolucion").disabled = true;
            } else {
                document.getElementById("mensaje").textContent = "Incorrecto. Intenta de nuevo.";
            }
        }

        // Si se pulsa el botón Ver Solución
        function mostrarSolucion() {
            document.getElementById("mensaje").textContent = `La solución era: ${palabraActual}`;
            document.getElementById("verSolucion").disabled = true;
        }

        // Si se pulsa eel boton Finalizar juego o se acaban las palabras
        function finalizarJuego() {
            // Calcula el porcentaje
            const porcentajeAciertos = ((aciertos / intentos) * 100).toFixed(2);
            // Muestra las cosas
            document.getElementById("resultado").textContent = `Juego finalizado. Aciertos: ${aciertos}, Intentos: ${intentos}, Porcentaje: ${porcentajeAciertos}%`;
            document.getElementById("nuevaPalabra").disabled = true;
            document.getElementById("verSolucion").disabled = true;
            document.getElementById("respuesta").disabled = true;
        }

    </script>
</body>

</html>
