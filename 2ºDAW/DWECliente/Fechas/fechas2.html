<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fechas y horas2</title>
</head>
<body onload="reloj_super_juaky()">
    <p id="reloj1" style="font-family: 'Courier New', Courier, monospace; font-size: 25px;">Hora Actual</p>
    <div id="reloj_actual" style="font-size: 50px; font-weight: bold;"></div>
    <p id="reloj2" style="font-family: 'Courier New', Courier, monospace; font-size: 25px;">Queda para los alfajores</p>
    <div id="reloj_navidad" style="font-size: 50px;font-style: italic;font-weight: bold;"></div>
    <script>
        //Función que muestra la hora actual con el contador corriendo
        function reloj_super_juaky(){
            let actual = new Date();
            let horas = actual.getHours();
            let minutos = actual.getMinutes();
            let segundos = actual.getSeconds();
            //Para que tengan dos dígitos
            horas=(horas<10)?("0"+horas): horas;
            minutos=(minutos<10)?("0"+minutos): minutos;
            segundos=(segundos<10)?("0"+segundos): segundos;

            let hora_actual="";
            hora_actual = horas+":"+minutos+":"+segundos;
            let reloj_actual=document.getElementById("reloj_actual").innerHTML=hora_actual;
            setTimeout("reloj_super_juaky()", 1000);//setTimeout se llama a sí misma cada milisegundo

            //Función para calcular lo que queda hasta navidad
            let anioActual= actual.getFullYear();
            let navidad= new Date(anioActual,11,25,23,59,59);
            let diferencia=navidad-actual;
            const segundosTotales = Math.floor(diferencia/1000);
            const minutosTotales = Math.floor(segundosTotales/60);
            const horasTotales = Math.floor(minutosTotales/60);
            const diasTotales = Math.floor(horasTotales/24);
            const segundosDiferencia= segundosTotales%60;
            const minutosDiferencia= minutosTotales%60;
            const horasDiferencia= horasTotales%24;
            let diasDiferencia = diasTotales;

             //Para que tengan dos dígitos
            horas=(horasDiferencia<10)?("0"+horasDiferencia): horasDiferencia;
            minutos=(minutosDiferencia<10)?("0"+minutosDiferencia): minutosDiferencia;
            segundos=(segundosDiferencia<10)?("0"+segundosDiferencia): segundosDiferencia;
            
            let hora_navidad="";
            hora_navidad = "Quedan "+diasDiferencia+" días. "+horas+":"+minutos+":"+segundos+" horas.";
            
            let reloj_navidad=document.getElementById("reloj_navidad").innerHTML=hora_navidad;
            setTimeout("reloj_super_juaky()", 1000);//setTimeout se llama a sí misma cada milisegundo

            
        }
    </script>
    
</body>
</html>
