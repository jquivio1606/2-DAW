<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>Usuario</h3>
    <input type="text" id="usuario">
    <h3>Clave de Acceso</h3>
    <input type="text" id="clave">
    <br>
    <br>
    <input type="button" id="boton" value="Cargar en la BD">
    <table id="tabla">

    </table>
    
    <br>
    <script>

        class Persona{
            constructor(Nombre,Clave){
                this.Nombre=Nombre;
                this.Clave=Clave;
            }
        };

        var boton = document.getElementById("boton");
        boton.addEventListener("click",rellenar,false);
        var baseDatos=[];
        function rellenar(){
            var getnombre = document.getElementById("usuario").value;//Guarda el nombre de usuario en la variable getnombre
            var getclave = document.getElementById("clave").value;//Guarda la clave en la variable getclave
            var usuario = new Persona(getnombre,getclave); //Crea un nuevo usuario con
            console.log(usuario);
            baseDatos.push(usuario);
            //console.log(baseDatos);
            document.getElementById("tabla").innerHTML += '<td>'+usuario.Nombre+'</td><td>'+usuario.Clave+'</td>'; 
        };

    </script>
</body>
</html>
