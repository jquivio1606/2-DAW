<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set</title>
</head>

<body>
    <script>
        let set = new Set();
        console.log(set.size);
        let juan = { nombre: "Juan" };
        let jose = { nombre: "José" };
        let fran = { nombre: "Francisco" };
        let pilar = { nombre: "Pilar" };
        set.add(juan);
        set.add(jose);
        set.add(fran);
        set.add(pilar);
        set.add(juan);
        console.log(set.size, set);
        //Recorrer set mostrando los valores
        for (let usuario of set) {
            console.log(usuario.nombre);
        }
        let set2 = new Set();
        let juanito = { nombre: "Juanillo" };
        let joselito = { nombre: "Joselito" };
        let pilarica = { nombre: "Pilarica" };
        set2.add(juan);
        set2.add(jose);
        set2.add(fran);
        set2.add(juanito);
        set2.add(joselito);
        set2.add(pilarica);
        console.log(set2.size, set2);
        for (let usuario of set2) {
            console.log(usuario.nombre);
        }
        //union --> const set = new Set ([...1Set, ...2Set]); Todos los elementos no repetidos
        const setUnion = new Set([...set, ...set2]);
        console.log("setUnion", setUnion);
        /*for(let usuario of setUnion){
            console.log(usuario.nombre);
        }*/
        //intersección --> [...1Set].filter(element => 2Set.has(element)); Elementos comunes
        const setInterseccion = new Set([...set].filter(element => set2.has(element)));
        console.log("setInterseccion", setInterseccion);
        /*for(let usuario of setInterseccion){
            console.log(usuario.nombre);
        }*/
        //diferencia --> [...1Set].filter(element => !2Set.has(element)); Aquellos que están en el primer conjunto pero no están en el segundo
        const setDiferencia = new Set([...set].filter(element => !set2.has(element)));
        console.log("setDiferencia del primero con el segundo", setDiferencia);
        /*for(let usuario of setDiferencia){
            console.log(usuario.nombre);
        }*/
        //[...2Set].filter(element => !1Set.has(element));
        const setDiferencia2 = new Set([...set2].filter(element => !set.has(element)));
        console.log("setDiferencia2 del segundo con el primero", setDiferencia2);
        /*for(let usuario of setDiferencia2){
            console.log(usuario.nombre);
        }*/
        //exclusión Todos los elementos de un set que no están en el otro set, añadiendo además los elementos del otro set que no están en el primero
        //[...1Set].filter(element => !2Set.has(element));
        const setExclusion = new Set([...setDiferencia].filter(element => !setDiferencia2.has(element)));
        console.log("setExclusion", setExclusion);
        /*for(let usuario of setExclusion){
            console.log(usuario.nombre);
        }*/

        set.forEach((valor,valor2,set)=>{
            console.log(valor);
        });


    </script>
</body>

</html>
