<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //Ejercicio 7
        let creditos, acceso='Salas: ';
        creditos=parseInt(prompt("Deme los créditos "));
        switch (creditos) {//No está realizado como debería, muestra de uso del break
            case 4:
                acceso+="Realidad Virtual, ";                
            case 3:
                acceso+="Juegos 3D, ";
            case 2:
                acceso+="Juegos 2D, ";
            case 1:
                acceso+="Consolas, ";
                break;
            default:
                acceso+="Ninguna";
        }
        alert(acceso);
    </script>
</body>
</html>
