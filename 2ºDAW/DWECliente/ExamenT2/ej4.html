<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 5</title>
</head>
<body>
    <script>
        //Creamos los dos arrays
        let ocupados=["Juaky", "Luisa", "Juan", "Ana"];
        let libres=["Judith", "José", "Alba", "Felipe"];

        //Función para añadir y quitar los elementos de los arrays
        function rotar(lista1, lista2){
            let primeroLista1=lista1.shift();
            lista2.push(primeroLista1);
            let primeroLista2=lista2.shift();
            lista1.push(primeroLista2);
        }

        //Muestra los arrays por consola
        console.log("Ocupados: "+ocupados);
        console.log("Libres: "+libres);

        //Usamos la función y mostramos los arrays un par de veces
        rotar(ocupados,libres);
        console.log("Ocupados: "+ocupados);
        console.log("Libres: "+libres);

        rotar(ocupados,libres);
        console.log("Ocupados: "+ocupados);
        console.log("Libres: "+libres);

    </script>
</body>
</html>
