<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2</title>
</head>

<body>
    <p>Los elementos del array son: <span id="array"></span></p>
    <button onclick="InsertarFinal()">Insertar al final</button>
    <button onclick="InsertarPrincipio()">Insertar al principio</button>
    <button onclick="BorrarPrincipio()">Borrar el primer elemento</button>
    <button onclick="BorrarFinal()">Borrar el último elemento</button>
    <script>
        //Creamos un array de números vacío
        let numeros = new Array();

        //Creamos las variables que utilizaremos en el random
        let maximo = 100;
        let minimo = 1;

        //Creamos la funcion aleatorio para obtener los números que iremos añadiendo al array
        function aleatorio() {
            var num = Math.round(Math.random() * (maximo - minimo) + minimo);
            return num;
        }

        //Funcion para insertar al final del array
        function InsertarFinal() {
            var num = aleatorio();
            numeros.push(num);
            document.getElementById("array").innerHTML = numeros;
        }

        //Funcion para insertar al principio del array
        function InsertarPrincipio() {
            var num = aleatorio();
            numeros.unshift(num);
            document.getElementById("array").innerHTML = numeros;
        }
        //Funcion para borrar al principio del array
        function BorrarPrincipio() {
            var num = aleatorio();
            numeros.shift(num);
            document.getElementById("array").innerHTML = numeros;
        }
        //Funcion para borrar al final del array
        function BorrarFinal() {
            var num = aleatorio();
            numeros.pop(num);
            document.getElementById("array").innerHTML = numeros;
        }
    </script>
</body>

</html>
