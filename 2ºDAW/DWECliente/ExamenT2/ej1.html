<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1</title>
</head>
<body>
    <label for="numero">Escribe un número</label>
    <input type="number" id="numero" min="1">
    <button onclick="capicua()">¿Es capicua?</button>
    <h1 id="mensaje"></h1>
    <script>
        function capicua(){
            //Guardamos el número en una variable y lo parseamos a entero
            let numero=parseInt(document.getElementById("numero").value);

            //Ese mismo número lo guardamos en una variable auxiliar para poder compararlo después
            let original=numero;

            //Creamos una variable donde iremos guardando los números que obtengamos
            let alReves=0;
            
            /*Mientras que el número sea mayor a 0 obtendremos el resto del número y lo iremos añadiendo a la variable alReves.
            El número lo dividimos entre 10 para seguir con el bucle e ir obteniendo los restos*/
            while(numero>0){
                alReves = alReves*10+(numero%10);
                numero=parseInt(numero/10);
            }
            //Mensajes que se muestran por pantalla
            if(alReves==original){
                document.getElementById("mensaje").innerHTML= "Es capicua!";
            }else{
                document.getElementById("mensaje").innerHTML= "No es capicua";
            }
        }
    </script>
    
</body>
</html>
