<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6</title>
</head>
<body>
    <label for="filas">Filas</label>
    <input type="number" id="filas">
    <button onclick="dibujar()">Dibujar</button>
    <p id="rombo"></p>
    <script>
        function dibujar(){
        let filas=document.getElementById("filas").value;
        let rombo="";
        //Primer triángulo
        for(let i=0;i<filas;i++){
            fila="";
            //Pinto los espacios
            for(let j=0;j<filas-1-i;j++){
                fila+=" ";
            }
            //Pinto los asteriscos
            if(i==0){
                fila+="*";
            }else{
                //Pintamos el primer asterisco de la línea
                fila+="*"
                //Pintamos los espacios intermedios
                for(let j=0;j<2*i-1;j++){
                    fila+=" ";
                }
                //Pintamos el último asterisco de la línea
                fila+="*";
            }
            //Guardamos la línea en rombo y añadimos un salto de línea
            rombo+=fila+"\n";
        }
        //Triángulo invertido
        for(let i=filas-1;i>=0;i--){
            fila="";
            //Pinto los espacios
            for(let j=0;j<filas-1-i;j++){
                fila+=" ";
            }
            //Pinto los asteriscos
            if(i==0){
                fila+="*";
            }else{
                //Pintamos el primer asterisco de la línea
                fila+="*"
                //Pintamos los espacios intermedios
                for(let j=0;j<2*i-1;j++){
                    fila+=" ";
                }
                //Pintamos el último asterisco de la línea
                fila+="*";
            }
            //Guardamos la línea en rombo y añadimos un salto de línea
            rombo+=fila+"\n";
        }
        document.getElementById("rombo").innerHTML=rombo;
        console.log(rombo);
    }
    </script>
</body>
</html>
