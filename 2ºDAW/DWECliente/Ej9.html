<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descuentos</title>
</head>
<body>
    <script>
        /*Usando un switch, lea una compra e indique:
        1. Si ha comprado menos de 100 euros no hay descuento
        2. Si la compra está entre 100 y 300 euros le descuenta un 5%
        3. Si la compra está por encima de 300 hasta 500 euros le descuenta un 10%
        4. Si la compra supera los 400 euros le descuenta un 15% */

        let factura, total;
        factura=parseInt(prompt("Dime el importe de la factura"));
        switch (true) {
            case (factura>=100 && factura<=300):
                descuento=5;
                break;
            case (factura>300 && factura<=500):
                descuento=10;
                break;
            case (factura>500):
                descuento=15;
                break;
            default:
                descuento=0;
                break;
        }
        total=factura*(1-descuento/100);
        alert("A pagar "+total+" €");
    </script>
</body>
</html>
