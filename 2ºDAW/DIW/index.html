<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Cinzel:wght@400..900&family=Luckiest+Guy&family=Pacifico&family=Shadows+Into+Light&display=swap"
        rel="stylesheet">
</head>

<body>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            display: grid;
            grid-template-areas:
                'header header'
                'nav aside'
                'main aside'
                'footer footer';
            grid-template-columns: 3fr 1fr;
            grid-template-rows: 100px 50px auto 50px;
            height: 100dvh;
        }

        header {
            grid-area: header;
           
            border: 1px solid black;
            display: flex;
            flex-direction: row;
        }

        nav {
            grid-area: nav;
            
            border: 1px solid blue;
            display: flex;
            flex-direction: row;
            gap: 15px;
            justify-content: space-evenly;
            align-items: center;
        }

        aside {
            grid-area: aside;
            border: 1px red solid;
        }

        main {
            grid-area: main;
            border: 1px blueviolet solid;
        }

        footer {
            grid-area: footer;
           
            border: 1px solid yellow;
        }

        .imagenes {
            display: flex;
            flex-direction: row;
            justify-content: space-evenly;
            margin-top: 20px;
        }
    </style>
    <header>
        <img src="./ExamenMaquetacion/imagenes/chancla.png" width="100" height="100">
        <h1>Cabecera</h1>
    </header>
    <nav>
        <a href="">Enlace 1</a>
        <a href="">Enlace 2</a>
        <a href="">Enlace 3</a>
    </nav>
    <main>
        <div class="imagenes">
            <img src="./ExamenMaquetacion/imagenes/resultados.jpg" width="200" height="200">
            <img src="./ExamenMaquetacion/imagenes/razon.jpg" width="200" height="200">
        </div>
        <div class="parrafos">
            <p>Párrafo 1</p>
            <p>Párrafo 2</p>
            <p>Párrafo 3</p>
        </div>
    </main>
    <aside>
        <form>
            <label for="nombre">Nombre: </label>
            <input type="text" id="nombre" name="nombre"><br>
            <label for="apellidos">Apellidos: </label>
            <input type="text" id="apellidos" name="apellidos">
            <button type="submit">Enviar</button>
        </form>
    </aside>
    <footer>Pie de página</footer>
</body>

</html>
