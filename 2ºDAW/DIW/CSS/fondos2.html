<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body{
            margin: 0;
            font-family: 'Courier New', Courier, monospace, Verdana, Geneva, Tahoma, sans-serif;
        }
        .imagen{
            background-image: url("/DIW/CSS/img/fondo2.jpg");
            height: 400px;
            background-position: center;
            background-repeat: no-repeat;/*repeat x: repite en horizontal, repeat y: repite en vertical*/
            background-size: cover;
        }
        .imagen-texto{
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            color:aliceblue;
        }
        h1{
            font-size: 50px;
        }
        h3{
            font-size: 20px;
        }
        button{
            background-color: green;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            padding: 10px 20px;
        }
        button:hover{
            background-color: blue;
        }
        button:active{
            background-color: orange;
        }
    </style>
    <title>Fondos 2</title>
</head>
<body>
    <div class="imagen">
        <div class="imagen-texto">
            <h1>IES TRAFALGAR</h1>
            <h3>Diseño de Interfaces</h3>
            <button>Matricúlate</button>
        </div>
    </div>
    <p>Ya es de noche y quiero dormir</p>
</body>
</html>
