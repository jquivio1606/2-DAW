<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid 2</title>
    <style>
        .contenedor{
            display: grid;
            grid-template-columns: 3fr 1fr;
            grid-template-rows: 100px 300px 100px;
            grid-template-areas: 
                'header header'
                'main aside'
                'footer footer';
            gap: 10px;
        }
        .item-1{
            grid-area: header;
            background-color: blue;
        }
        .item-2{
            grid-area: main;
            background: rgb(225, 173, 230);            
        }
        .item-3{
            grid-area: aside;
            background: rgb(177, 173, 230);
        }
        .item-4{
            grid-area: footer;
            background: yellow;
        }

    </style>
</head>
<body>
    <div class="contenedor">
        <div class="item item-1">1</div>
        <div class="item item-2">2</div>
        <div class="item item-3">3</div>
        <div class="item item-4">4</div>
    </div>
    </div>
    
</body>
</html>
