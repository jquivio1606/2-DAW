<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .contenedor{
            display: grid;
            grid-template-columns: 1fr 2fr;
            grid-template-rows: repeat(3,50px);;
        }
    </style>
</head>

<body>
    <div class="contenedor">
        <div class="cabecera"> celda 1 </div>
        <div class="sidebar"> celda 2</div>
        <div class="main"> celda 3: contenido que marca el alto de la parte central</div>
        <div class="footer"> celda 4</div>
    </div>
</body>

</html>
