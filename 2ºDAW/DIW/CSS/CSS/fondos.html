<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        *{
            font-family: 'Courier New', Courier, monospace;
        }
        .texto{
            font-size: 24px;
        }
        .boton{
            background-color: blue;
            color: white;
            border: none;
            font-size: 18px;
            padding: 10px 20px;
            border-radius: 5px;
            cursor:pointer;
        }
        .contenedor{
            background-image: url("/DIW/CSS/img/fondo3.jpg");
            background-size: cover; /*Cover ocupa toda la caja*/
            background-position: center center;/*Posición de la imagen dentro de la caja*/
            background-repeat: no-repeat;
            background-attachment: fixed; /*Dejar fija la imagen*/
            opacity: 0.8; /*Opacidad*/
            text-align: center;
            padding: 40px;
        }
    </style>
    <title>Fondos DIW</title>
</head>
<body>
    <div class="contenedor">
        <h2 class="texto">Descubre nuestro código Estrella!!!</h2>
        <p class="texto">Ánimate tenemos ofertas ahorra un 30%</p>
        <button class="boton">Compra now</button>
    </div>
</body>
</html>
