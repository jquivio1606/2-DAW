<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Las Tres Rejas</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        div{
            border: black solid 1px;
        }
        .contenedor{
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 20px 20px;
            font-family: sans-serif;
        }
        .titulo{
            justify-content: center;
            align-items: center;
        }
        .cuerpo{
            display: flex;
            flex-direction: row;
            
        }
        .menu{
            display: flex;
            flex-direction: column;
        }
        .item{
            display: flex;
            flex-direction: row;
        }

    </style>
</head>
<body>
    <div class="contenedor">
        <div class="titulo">Las 3 Rejas
            <div class="pueblo">MEDINA</div>
        </div>
        <div class="cuerpo">
            <div class="menu">
                <div class="item">
                    <div class="foto">Aquí va una foto</div>
                    <div class="nombre">Alfajores</div>
                </div>
                <div class="item">
                    <div class="foto">Aquí va una foto</div>
                    <div class="nombre">Pardas</div>
                </div>
                <div class="item">
                    <div class="foto">Aquí va una foto</div>
                    <div class="nombre">Polvorones</div>
                </div>
            </div>
            <div class="localizacion">
                <div class="tituloLocalización">Localización</div>
                <div class="mapa"></div>
            </div>
        </div>
    </div>
</body>
</html>
