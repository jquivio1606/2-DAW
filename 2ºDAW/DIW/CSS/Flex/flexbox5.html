<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uso flexbox</title>
    <style>
        .main {
            display: flex;
            min-height: 100vh;
            gap: 2px;
            color: azure;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }

        .main .sidebar,
        .main .contenido {
            height: 100vh;
            padding: 12px 24px 12px 24px;
        }

        .sidebar {
            background-color: rgb(0, 174, 255);
            flex: 1;
            /*El espacio que ocupa la caja*/
        }

        .contenido {
            background-color: #419e2c;
            flex: 4;
        }

        ul {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 2px;
            list-style: none; /*Para quitar el puntito de la lista*/
            width: max-content;
            padding: 0px; /*Pega el contenido a la izquierda*/
        }

        ul li {
            border-bottom: 1px solid black;
            
        }

        ul a,
        ul a:link {
            text-decoration: none;
            padding: 8px 8px;
            display: block;
            width: 100%;
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="sidebar">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Servicios</a></li>
                <li><a href="#">Opciones</a></li>
                <li><a href="#">Planes</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
        </div>
        <div class="contenido">Esto sería el contenido principal</div>
    </div>
</body>

</html>
