<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uso de Flexbox</title>
    <style>
        .container{
            border: solid 2px black;
            display: flex;
            /*flex-direction: row;
            flex-wrap: wrap-reverse;*/
            /*flex-flow: row ;Une flex-direccion y flex-wrap en una sola línea*/
            background-color: rgb(103, 232, 230);
            width: 600px;
            height: 600px;
            flex-wrap: wrap;
            align-content: space-evenly;
            /*gap: 4px; Margenes(filas columnas) "gap: 2px 4px"*/
            /*row-gap: 4px;
            column-gap: 8px;
            justify-content: center;
            align-items: stretch;*/
        }
        .item{
            background: rgb(172, 51, 228);
            border: solid 1px black;
            width: 100px;
            height: 100px;
            
        }
    </style>
</head>
<body>
    <div class="container"> <!--Flex container-->
        <div class="item item-1">1</div> <!--Flex items-->
        <div class="item item-2">2</div>
        <div class="item item-3">3</div>
        <div class="item item-4">4</div>
        <div class="item item-5">5</div>
        <div class="item item-6">6</div>
        <div class="item item-7">7</div>
        <div class="item item-8">8</div>
        <div class="item item-9">9</div>
        <div class="item item-10">10</div>
        <div class="item item-11">11</div>
        <div class="item item-12">12</div>
        <div class="item item-13">13</div>
    </div>
</body>
</html>
