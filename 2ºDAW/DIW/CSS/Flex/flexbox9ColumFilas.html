<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Columnas con filas</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .contenedor{
            display: flex;
            flex-direction: row;
            border: black solid 1px;
            height: 100vh;
            padding: 20px 20px;
            font-family: sans-serif;
        }
        .izq{
            flex:4;
            background: rgb(4, 117, 108);
            color: white;
            padding: 10px 10px;
        }
        .der{
            flex: 2;
            display: flex;
            flex-direction: column;
           
        }
        .alta{
            flex: auto;
            border: rgb(169, 169, 169) solid 1px;;
            padding: 20px 20px;
        }
        .baja{
            flex: auto;
            border: rgb(169, 169, 169) solid 1px;
            padding: 20px 20px;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <div class="izq">Columna izquierda</div>
        <div class="der">
            <div class="alta">Derecha parte alta</div>
            <div class="baja">Derecha parte baja</div>
        </div>
    </div>
</body>
</html>
