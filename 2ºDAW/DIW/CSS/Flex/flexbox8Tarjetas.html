<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tres tarjetas</title>
    <style>
        .contenedor{
            display: flex;
            flex-direction: row;
            justify-content: space-around;/*Espacio entre las cajas*/
            flex-wrap: wrap;
        }
        .tarjeta{
            display: flex;
            flex-direction: column;
            border: black solid 1px;
            box-shadow: 0px 0px 7px 0px gray;
            width: 300px;
            height: 200px;
            
        }
        .tarjeta .titulo{
            display: flex;
            flex: 1;
            background: black;
            color: white;
            align-items: center;
            justify-content: center;
        }
        .tarjeta .cuerpo{
            flex: 4;
            padding: 10px 10px;
        }
        .tarjeta .pie{
            display: flex;
            flex: 1;
            background: rgb(165, 162, 162);
            color: white;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <div class="tarjeta">
            <div class="titulo">Tarjeta Izquierda</div>
          <div class="cuerpo">
            <p>Contenido del cuerpo </p>
            <p>Contenido del cuerpo </p>
            <p>Contenido del cuerpo &nbsp;</p>
          </div>
          <div class="pie">Pie </div>
        </div>
        <div class="tarjeta">  
          <div class="titulo">Tarjeta centro</div>
          <div class="cuerpo">
            <p>Contenido del cuerpo </p>
          </div>
          <div class="pie">Pie </div>
        </div>
        <div class="tarjeta">  
          <div class="titulo">Tarjeta derecha</div>
          <div class="cuerpo">
            <p>Contenido del cuerpo </p>
          </div>
          <div class="pie">Pie </div>
        </div>
      </div>
    
</body>
</html>
