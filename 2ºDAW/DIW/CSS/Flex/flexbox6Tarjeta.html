<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uso Flexbox</title>
    <style>
        .tarjeta{
            display: flex;
            flex-direction: column;
            width: 400px;
            height: 300px;
            box-shadow: 0px 0px 7px 0px gray;
        }
        .tarjeta .titulo{
            flex: 1;
            background: black;
            color: white;
            text-align: center;
            /*align-items: center (alinear en vertical)
            justify-content: center (alinear en horizantal*/
        }
        .tarjeta .cuerpo{
            flex: 4;
            padding: 10px 10px;
        }
        .tarjeta .pie{
            flex: 1;
            background: rgb(165, 162, 162);
            color: white;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="tarjeta">
        <div class="titulo">
            <h2>Tarjeta de presentación</h2>
        </div>
        <div class="cuerpo">Contenido del cuerpo de la tarjeta</div>
        <div class="pie">
            <h4>Pie de la tarjeta</h4>
        </div>
    </div>
</body>
</html>
