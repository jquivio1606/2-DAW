<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uso flexbox</title>
    <style>
        .contenedor{
            display: flex;
            flex-direction: row;
            justify-content: space-between;
        }
        .contenedor .menu{
            flex-direction: row;
        }
    </style>
</head>

<body>
    <div class="contenedor">
        <div class="nombre">Nombre del sitio</div>
        <div class="menu">
            <ul>
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Acerca</a></li>
                <li><a href="#">Servicios</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
        </div>
    </div>

</body>

</html>
