<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Préstamo Libros</title>
</head>
<body>
    <form  action="#"  method="post">
        <label for="titulo">Título</label>
        <select id="titulo" name="titulo">
            <option value="libro1">La reina roja</option>
            <option value="libro2">El código Da Vinci</option>
            <option value="libro3">La sombra del viento</option>
            <option value="libro4">El alquimista</option>
        </select>
        <br><br>
        <label for="dias">Días</label>
        <input type="number" id="dias" name="dias" onfocusout="coste.value=dias.value*2+' Euros'">
        <br><br>
        <p>Precio: <output name=coste for="dias"></output></p>
        <br>
        <label for="observaciones">Observaciones</label>
        <br><br>
        <textarea name="observaciones" cols="40" rows="4"></textarea>
        <label for="ebooks">Escribe la marca de tu Ebook</label>
        <input list="ebooks" name="Ebook">
        <datalist id="ebooks">
            <option value="Xiaomi"></option>
            <option value="Kobo"></option>
            <option value="BQ"></option>
        </datalist>
        <input type="submit" value="Enviar">
    </form>
    <form>
        <label for="nombre">Datos del cliente</label>
        <br><br>
        <label for="alquiler">Precio del alquiler 2€/día</label>
        <br><br>
        <label for="diasAlquiler">Días</label>
        <input type="number" id="diasAlquiler" name="diasAlquiler" onchange="alquilerTotal.value=diasAlquiler.value*2+' Euros'">
        <br><br>
        <label for="total">Total: </label>
        <output name="alquilerTotal"></output>
        <br><br>
    
    <fieldset>
        <legend>Datos del cliente</legend>
        <label for="nombre">Nombre </label>
        <input id="nombre" name="nombre">
        <br>
        <label for="apellidos">Apellidos </label>
        <input id="apellidos" name="apellidos">
    </fieldset>
    <input type="submit" value="Enviar">
</form>
</body>
</html>
