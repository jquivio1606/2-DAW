<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <title>Formularios</title>
</head>

<body>
    <header>
        <h1>Registros de Usuarios</h1>
    </header>
    <main>

        <form action="#" method="post">
            <div class="container-fluid">
                <div class="row">
                    <div class="col">
                        <fieldset>
                            <legend>Información Personal</legend>
                            <div class="mb-3">
                                <label for="nombre">Nombre: </label>
                                <input type="text" id="nombre" name="nombre" required><br><br>
                            </div>
                            <label for="apellidos">Apellidos: </label>
                            <input type="text" id="apellidos" name="apellidos" required><br><br>
                            <label for="fecnac">Fecha de nacimiento: </label>
                            <input type="date" id="fecnac" name="fecnac" required><br><br>
                            <legend>Género</legend>
                            <label for="masculino">Masculino</label>
                            <input type="radio" id="masculino" name="genero" value="Masc" required>
                            <label for="femenino">Femenino</label>
                            <input type="radio" id="femenino" name="genero" value="Fem" required>
                            <label for="otros">Otro</label>
                            <input type="radio" id="otros" name="genero" value="otr" required>
                        </fieldset>
                    </div>
                    <div class="col">
                        <fieldset>
                            <legend>Información de Contacto</legend>
                            <label for="email">Correo electrónico: </label>
                            <input type="email" id="email" name="email" required><br><br>
                            <label for="telefono">Teléfono de Contacto: </label>
                            <input type="tel" id="telefono" name="telefono" required><br><br>
                            <label for="direccion">Dirección: </label>
                            <textarea id="direccion" rows="4" cols="50" name="direccion"></textarea>
                        </fieldset>
                    </div>
                    <div class="col">
                        <fieldset>
                            <legend>Información de la Cuenta</legend>
                            <label for="usuario">Cuenta de Usuario: </label>
                            <input type="text" id="usuario" name="usuario" required><br><br>
                            <label for="contrasena">Contraseña de la cuenta: </label>
                            <input type="password" id="contrasena" name="contrasena" required><br><br>
                            <label for="confirma">Repetir/Confirma Clave: </label>
                            <input type="password" id="confirma" name="confirma" required>
                        </fieldset>

                    </div>
                    <div class="col">
                        <fieldset>
                            <legend>Preferencias de color del Coche</legend>
                            <select name="colores" id="colores">
                                <option value="Rojo">Rojo</option>
                                <option value="Verde">Verde</option>
                                <option value="Azul">Azul</option>
                                <option value="Amarillo">Amarillo</option>
                                <option value="Violeta">Violeta</option>
                            </select><br><br>
                            <div class="mb-2 form-check">
                                <input type="checkbox" for="clausula">
                                <label name="clausula" id="clausula" required>Acepta los términos y condiciones</label>
                            </div>
                        </fieldset>
                    </div>
        </form>
        </div>
        </div>
    </main>


</body>

</html>
