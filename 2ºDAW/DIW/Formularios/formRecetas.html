<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
    <title>Formularios recetas</title>
</head>

<body>
    <section style="width: fit-content; display: block; margin: auto;">
        <h1>Envía tu foto de la receta de tu manteca Colorá</h1>
        <form action="#" method="post">
            <label for="receta">Receta</label>
            <input id="receta" name="receta">
            <br><br>
            <label for="tipo">Tipo de receta </label>
            <select id="tipo" name="tipo">
                <option value="carne">Carne</option>
                <option value="pescado">Pescado</option>
                <option value="verdura">Verdura</option>
            </select>
            <br><br>
            <label for="imagen">Seleccionar imagen</label>
            <input type="file" id="imagen" name="imagen">
            <br><br>
            <input type="submit" value="Enviar" class="btn btn-primary">
        </form>
    </section>
</body>

</html>
