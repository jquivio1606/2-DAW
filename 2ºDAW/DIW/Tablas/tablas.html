<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas</title>
</head>
<body>
    <table border="2" align="center"><!-- Aunque se puede poner atributos en la tabla en html, ya no se hace, se hace en el CSS-->
        <caption>Tabla I: Ejemplo de tablas de contenido</caption>
        <colgroup>
            <col span="2" style="background-color: red;">
            <col span="1" style="background-color: green;">
        </colgroup>
        <tr>
            <th>Nombre</th>
            <th>Apellidos</th>
            <th>Edad</th>
        </tr>
        <tr>
            <td>SuperJuaky</td>
            <td>Moreno Gallardo</td>
            <td>18</td>
        </tr>
        <tr>
            <td>Claudia</td>
            <td>Ledoldis Patón</td>
            <td>18</td>
        </tr>
        <tr>
            <td>Abril</td>
            <td>Viroga Ledoldis</td>
            <td>12</td>
        </tr>
    </table>
</body>
</html>
