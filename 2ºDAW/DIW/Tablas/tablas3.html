<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas 3</title>
</head>
<body>
    <h5 style="color: brown;font-weight: normal;font-size: 28px;font-family: 'Courier New', Courier, monospace;
        text-transform: uppercase;">Vamos a por el estilo en las tablas</h5>
    <style type="text/css">
        table{
            border: 2px solid forestgreen;
        }
        td,th{
            border: 1px;
            padding: 10px;
        }
        th{
            background: black;
            color: beige;
            text-transform: uppercase;
        }
        td{
            text-align: center;
            border-bottom: 2px solid blueviolet;
        }
    </style>
    <h5>Aplicando Semántica</h5>
    <table><!-- El col y row tiene que ir dentro del caption, no puede ir antes ni después -->
        <caption>Notas de DIW</caption>
        <tfoot>
            <tr>
                <td>Media</td>
                <td>6.32</td>
                <td>8.56</td>
                <td>9.65</td>
            </tr>
        </tfoot>
        <thead>
            <tr>
                <th rowspan="2">Alumna/o</th>
                <th colspan="3">Notas</th>
            </tr>
            <tr>
                <td>1ª Ev</td>
                <td>2ª Ev</td>
                <td>3ª Ev</td>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Amarosa</td>
                <td>3.2</td>
                <td>5.6</td>
                <td>9.56</td>
            </tr>
            <tr>
                <td>Amparo</td>
                <td>6.32</td>
                <td>10</td>
                <td>8.56</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
