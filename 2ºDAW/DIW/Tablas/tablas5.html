<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas 5</title>
</head>
<body>
    <style>
        img{
            width: 300px;
            height: 250px;
        }
        thead, tfoot{
            font-size: 30px;
        }
        caption{
            font-size: 50px;
            padding: 60px;
        }
    </style>
    <table>
        <caption>Elige la casa de tus sueños</caption>
        <thead>
            <tr>
                <th>Casa piscina</th>
                <th>Casa balcón</th>
                <th>Casa gris</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th><img src="../casa-1.png"></th>
                <th><img src="../casa-2.png"></th>
                <th><img src="../casa-3.png"></th>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th>800.000€</th>
                <th>750.000€</th>
                <th>900.000€</th>
            </tr>
        </tfoot>

    </table>
    
</body>
</html>
