<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas 2</title>
</head>
<body>
    <h5 style="color: brown;font-weight: normal;font-size: 28px;font-family: 'Courier New', Courier, monospace;
        text-transform: uppercase;">Vamos a por el estilo en las tablas</h5>
    <style type="text/css">
        table{
            border: 2px solid forestgreen;
        }
        td,th{
            border: 1px;
            padding: 10px;
        }
        th{
            background: black;
            color: beige;
            text-transform: uppercase;
        }
        td{
            text-align: center;
            border-bottom: 2px solid blueviolet;
        }
    </style>
    <h5>Agrupando</h5>
    <table>
        <caption>Tabla II: Agrupando celdas horizontal y vertical</caption>
        <tr>
            <th>Encabezado 1</th>
            <th>Encabezado 2</th>
            <th>Encabezado 3</th>
            <th>Encabezado 4</th>
        </tr>
        <tr>
            <td rowspan="2">Campo 1</td>
            <td>Campo 2</td>
            <td>Campo 3</td>
            <td>Campo 4</td>
        </tr>
        <tr>
            <td colspan="2">Campo 5</td>
            <td>Campo 6</td>
        </tr>
        <tr>
            <td>Campo 7</td>
            <td>Campo 8</td>
            <td colspan="2" rowspan="2">Campo 9</td>
        </tr>
        <tr>
            <td>Campo 10</td>
            <td>Campo 11</td>
        </tr>
    </table>
</body>
</html>
