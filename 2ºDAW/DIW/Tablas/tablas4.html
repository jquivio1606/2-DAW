<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas 4</title>
</head>

<body>
    <style>
        th,td{
            border: 1px solid orangered;
            padding: 10px;
        }
        tfoot,td{
            background: violet;
            color: aqua;
            border: 0;
        }
        table{
            border: 2px solid cornflowerblue;
        }
        .primero{background: orange;}
        .segundo{background: blue;}
        .tercero{background: red;}
    </style>
    <table>
        <caption>Notas del Alumnado 2 DAW</caption>
        <colgroup>
            <col></col>
            <col class="primero"></col>
            <col class="segundo"></col>
            <col class="tercero"></col>
        </colgroup>
        <tfoot>
            <tr>
                <td>Media</td>
                <td>7</td>
                <td>8.5</td>
                <td>9</td>
            </tr>
        </tfoot>
        <thead>
            <tr class="titulo">
                <th rowspan="2">Alumna/o</th>
                <th colspan="3">Notas</th>
            </tr>
            <tr>
                <td>1ª Ev</td>
                <td>2ª Ev</td>
                <td>3ª Ev</td>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Amarosa</td>
                <td>10</td>
                <td>9</td>
                <td>10</td>
            </tr>
            <tr>
                <td>Amparo</td>
                <td>6</td>
                <td>10</td>
                <td>8</td>
            </tr>
            <tr>
                <td>Quintana</td>
                <td>5</td>
                <td>7</td>
                <td>9</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
