<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videoclub Online 🎥</title>
    
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="./estilos.css">
</head>

<body>
    <div class="cont-principal">
        <h1>🎥 Bienvenido al Videoclub Online 🎬</h1>
        <p>¡Busca información sobre tus películas favoritas!</p>
        <div id="cont-buscador">
            <input type="text" id="titulo_peli" placeholder="Escribe el título de una película...">
            <button type="submit" id="btn">Buscar</button>
        </div>

        <h3 id="cargando" hidden> Cargando...</h3>
        <br>
        <div id="cont-datos">
            <!-- Aquí se mostrará la información de las películas -->
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
