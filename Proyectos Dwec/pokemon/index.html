<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeConsulta</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Consulta Pokemon</h1>

        <!-- Buscar por ID -->
        <div class="input-group mb-3">
            <input type="number" id="pokemonId" min="1" class="form-control" placeholder="Ingrese ID de Pokemon">
            <button class="btn btn-primary separador" onclick="getAxiosPokemonPorId()">Buscar</button>
            <button class="btn btn-primary" onclick="borrarPokemon()">Borrar</button>
        </div>

        <div id="pokemonInfo" class="text-center mb-4"></div>

        <!-- Botón para consultar todos y borrar la tabla-->
        <div class="cont-buttons">
            <button class="btn btn-success mb-3" onclick="getAxiosTodosPokemons()">Mostrar 20 Pokemon</button>
            <button class="btn btn-warning mb-3" onclick="borrarTabla()">Ocultar Tabla</button>
        </div>
        <!-- Tabla -->
        <table class="table table-striped table-bordered">
            <thead id="pokemonTableHead"></thead>
            <tbody id="pokemonTableBody"></tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
