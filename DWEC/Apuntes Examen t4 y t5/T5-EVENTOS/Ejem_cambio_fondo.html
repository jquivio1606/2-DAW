<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cambio de Fondo</title>
</head>
<body>

  <div id="cuadro" style="width: 200px; height: 100px; border: 1px solid #000;">
    Pasa el ratón por encima
  </div>

  <script>
    // Función para cambiar el color de fondo dependiendo del tipo de evento (mouseover o mouseout)
    function cambFondo(evento) {
      // Si el evento es mouseover, el fondo se cambia a "lightblue", sino a "white"
      col = (evento.type == "mouseover") ? "lightblue" : "white";
      
      // Se cambia el color de fondo del elemento que disparó el evento (currentTarget)
      evento.currentTarget.style.backgroundColor = col;
    }

    // Obtenemos el elemento con id 'cuadro' y le asignamos los manejadores de evento
    var o = document.getElementById("cuadro");

    // Al pasar el ratón sobre el elemento, se ejecuta la función cambFondo
    o.addEventListener("mouseover", cambFondo);

    // Al salir el ratón del elemento, también se ejecuta la función cambFondo
    o.addEventListener("mouseout", cambFondo);
  </script>

</body>
</html>
