<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obteniendo Elementos del DOM</title>
</head>

<body>

    <h1 id="tituloPrincipal">Título Principal</h1>
    <p class="descripcion">Este es un párrafo de descripción.</p>
    <button id="miBoton">Haz clic aquí</button>

    <script>
        //getElementById: Obtiene un único elemento basado en su id.
        //querySelector: Obtiene el primer elemento que coincida con el selector CSS proporcionado.
        //querySelectorAll: Obtiene todos los elementos que coinciden con el selector. Devuelve una NodeList.
        //getElementsByName: Obtiene elementos basados en el atributo name, útil para formularios.
        //getElementsByTagName: Obtiene todos los elementos con un nombre de etiqueta específico.
        //getElementsByClassName: Obtiene todos los elementos con una clase específica.


        // Obtener un elemento por su ID
        const titulo = document.getElementById('tituloPrincipal');//elemento con id "tituloPrincipal"

        // Obtener el primer elemento que coincida con un selector CSS
        const descripcion = document.querySelector('.descripcion'); //primer elemento con la clase "descripcion"

        // Obtener todos los elementos que coincidan con un selector CSS (devuelve una NodeList)
        const botones = document.querySelectorAll('button'); //todos los botones en la página

        // Obtener un elemento por su nombre (solo para formularios)
        const botonFormulario = document.getElementsByName('miFormulario'); //Elemento con el nombre "miFormulario"

        // Obtener todos los elementos por su nombre (devuelve una HTMLCollection)
        const parrafos = document.getElementsByTagName('p');
        console.log(parrafos); // Muestra todos los elementos <p> en la página

        // Obtener un solo elemento por su clase (devuelve el primer elemento con esa clase)
        const primerParrafo = document.getElementsByClassName('descripcion'); //primer <p> con la clase "descripcion"
    </script>

</body>

</html>
