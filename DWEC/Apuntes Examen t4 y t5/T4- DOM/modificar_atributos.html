<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificando Atributos y Contenidos</title>
</head>
<body>

    <img id="miImagen" src="image1.jpg" alt="Imagen inicial" width="300">

    <script>
        //setAttribute: Modifica un atributo de un elemento.
        //textContent: Modifica el texto dentro de un elemento.




         // Modificar el atributo 'src' de una imagen
         const imagen = document.getElementById('miImagen');
        imagen.src = 'image2.jpg'; // Cambiar la imagen

        // Modificar el atributo 'alt' de la imagen
        imagen.alt = 'Imagen modificada';

        // Usar `setAttribute` para modificar cualquier atributo
        imagen.setAttribute('width', '500'); // Cambia el ancho de la imagen

        // Modificar el contenido de un párrafo usando `textContent`
        const parrafo = document.createElement('p');
        parrafo.textContent = 'Este es un párrafo que será agregado al DOM';
        document.body.appendChild(parrafo);

    </script>

</body>
</html>
