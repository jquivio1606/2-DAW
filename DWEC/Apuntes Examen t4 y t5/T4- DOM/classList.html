<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>
        // Seleccionar el elemento
        let elemento = document.querySelector("div");

        // Añadir una clase
        elemento.classList.add("nueva-clase");

        // Eliminar una clase
        elemento.classList.remove("vieja-clase");

        // Alternar una clase
        elemento.classList.toggle("activo");

        // Verificar si tiene una clase
        if (elemento.classList.contains("nueva-clase")) {
            console.log("El elemento tiene la clase 'nueva-clase'");
        }

        // Obtener la clase en una posición específica
        console.log(elemento.classList.item(0)); // Muestra la primera clase del elemento


    </script>
</body>

</html>
