<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Principios de Asincronía</title>
</head>
<body>
    
    <script>

        const datos =[
        {
                titulo:'Don Quijote',
                año: '1495',
                autor:'Cervantes',
                isbn:'12345'
            },
            {
                titulo:'Don Luis',
                año: '2024',
                autor:'Domingo',
                isbn:'45323'
            },
            {
                titulo:'El proyecto final',
                año: '2024',
                autor:'Reverte',
                isbn:'45323'
            },
            {
                titulo:'Manolito Gafotas',
                año: '1960',
                autor:'Elvira Lindo',
                isbn:'135432345'
            }
        ];

        // NO se pa que hemos hecho esto pero sale undefined
        function obtenerDatos(){
            setTimeout(()=>{
                return datos;
            }, 2000);
        }
        console.log(obtenerDatos());

        
        /* Javascript tiene un objeto llamado: Promise */
        function obtenerDatosPromesa(){
            // Resolve: para devolver la respuesta ok, si los datos estan perfe
            // Reject: para devolver un error si no pasa algo mal con los datos
            return new Promise((resolve, reject) => {
                if(datos.length == 0){
                    reject(new Error('No hay datos'));
                } else {
                    // El setTimeout es para simular que tenemos los datos en otro lado y lo obtenemos
                    setTimeout(()=>{ 
                        resolve(datos);
                    }, 2000);
                }
            });

        }

        obtenerDatosPromesa()
        .then((respuesta) =>{console.log(respuesta)}) //recoge el valor que devuelve el resolve
        .catch((error) => {console.error(error)}); //recoge el error del reject 


        /*   async await, fetch   */

        // Con esta forma NO hay que hacer esto: 
        // obtenerDatosPromesa()
        //.then((respuesta) =>{console.log(respuesta)})
        //.catch((error) => {console.error(error)});
        async function obtenerDatosAwait(){
            const libros = await obtenerDatosPromesa();
            console.log(libros);
        };

        obtenerDatosAwait();

    </script>
</body>
</html>
