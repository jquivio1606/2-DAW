<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tienda | Fashion Store</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    <!-- Bootstrap Icons (para redes sociales, carrito, etc.) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />

    <!-- Tu hoja de estilos personalizada -->
    <link rel="stylesheet" href="../css - scss/estilos.css" />
</head>

<body>
    <!-- HEADER -->
    <header class="container d-flex align-items-center justify-content-between py-3 px-5">
        <!-- Logo e Identidad -->
        <div class="d-flex align-items-center">
            <img id="logo-header" src="../img/Logo.png" alt="Logo Tienda de Ropa" title="Logo de la Tienda de Ropa" />
            <h1 class="ms-5">Fashion Store</h1>
        </div>
        <!-- Enlaces de cuenta -->
        <div id="cuenta">
            <a href="#">Iniciar Sesión</a> |
            <a href="#">Registrarse</a>
        </div>
    </header>

    <!-- NAVBAR -->
    <nav
    class="px-5 container d-flex align-items-center navbar navbar-expand-lg justify-content-between px-3">
    <!-- Menú a la izquierda -->
    <ul class="nav">
      <li class="nav-item ms-3">
        <a class="nav-link active" href="inicio.html">Inicio</a>
      </li>
      <li class="nav-item ms-3">
        <a class="nav-link" href="tienda.html">Tienda</a>
      </li>
      <li class="nav-item ms-3">
        <a class="nav-link" href="#">Contacto</a>
      </li>
    </ul>

    <!-- Cesta a la derecha (icono) -->
    <a href="#" class="nav-link icono" title="Icono de la cesta de compra">
      <i class="bi bi-basket-fill"></i>
    </a>
  </nav>

    <!-- SUBNAV PARA CATEGORÍAS Y BÚSQUEDA  -->
    <div class="subnav container p-2 px-5 d-flex align-items-center justify-content-between mb-3">
        <!-- Categorías -->
        <ul class="nav">
            <li class="nav-item ms-3"><button class="nav-link" onclick="cargarRopa()">Ropa</button></li>
            <li class="nav-item ms-3"><button class="nav-link" onclick="cargarZapatos()">Calzado</button></li>
            <li class="nav-item ms-3"><button class="nav-link" onclick="cargarAccesorios()">Accesorios</button></li>
            <li class="nav-item ms-3"><button class="nav-link" onclick="cargarOfertas()">Ofertas</button></li>
        </ul>
        <!-- Formulario de búsqueda -->
        <form class="d-flex" role="search">
            <input class="form-control me-2" type="search" placeholder="Buscar producto..." aria-label="Buscar" />
            <button class="btn-buscar" type="submit" title="Icono de Buscar"><i class="bi bi-search"></i></button>
        </form>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="container my-4 px-5">
        <h2 id="titulo" class="text-center mb-4">Nuestra Tienda</h2>

        <!-- GRID DE PRODUCTOS  -->
        <div id="cont-prod" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-5 g-4">

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="container text-center py-3 position-sticky-bottom">
        <a href="#" class="mx-2">Privacidad</a> |
        <a href="#" class="mx-2">Aviso Legal</a> |
        <a href="#" class="mx-2">Accesibilidad</a>
        <!-- Iconos de redes sociales -->
        <div class="mt-2">
            <i class="bi bi-facebook fs-4 px-2"></i>
            <i class="bi bi-instagram fs-4 px-2"></i>
            <i class="bi bi-twitter fs-4 px-2"></i>
          </div>
    </footer>

    <!-- Librería Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <!-- Tu script personalizado -->
    <script src="../js/script_productos.js"></script>

</body>

</html>
